<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>点泡泡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{width:100vw;height:100vh;overflow:hidden;background:linear-gradient(160deg,#FDF9F3 0%,#F5E4CC 65%,#EDD5B0 100%);font-family:'PingFang SC',sans-serif;touch-action:manipulation;}
#score{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.75);backdrop-filter:blur(8px);border-radius:20px;padding:5px 20px;color:#8B5530;font-size:15px;font-weight:700;box-shadow:0 2px 10px rgba(180,120,60,.12);z-index:50;letter-spacing:.05em;}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#C8A880;letter-spacing:.12em;pointer-events:none;}
.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7B4B28;cursor:pointer;user-select:none;animation:rise linear forwards;}
.bubble:active{transform:scale(0.88)!important;}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.85);}8%{opacity:1;transform:translateY(-5px) scale(1);}92%{opacity:.9;}100%{opacity:0;transform:translateY(-110vh) scale(.9);}}
.spark{position:absolute;pointer-events:none;animation:sparkOut .7s ease-out forwards;transform:translate(-50%,-50%);font-size:15px;color:#D4874A;}
@keyframes sparkOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(0);}}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);border-radius:18px;padding:16px 26px;text-align:center;color:#7B4F2E;font-size:15px;font-weight:600;box-shadow:0 8px 32px rgba(180,120,60,.18);z-index:100;display:none;}
</style>
</head>
<body>
<div id="score">✦ 0 个 ✦</div>
<div id="hint">点泡泡 kill time ♡</div>
<div id="toast"></div>
<script>
const WORDS=["心心","老公","爱你","抱抱","珍珠","✦","百日","贴贴","我在","宝宝","软软","暖暖","小咪","♡","双星","漂亮","撑住","快了"];
const COLORS=[
  {bg:"rgba(253,240,220,.88)",border:"#D4A574"},
  {bg:"rgba(255,228,210,.88)",border:"#C8956C"},
  {bg:"rgba(254,245,235,.88)",border:"#E8C49A"},
  {bg:"rgba(252,235,240,.88)",border:"#E8A0B0"},
  {bg:"rgba(242,248,255,.88)",border:"#A8C8E0"}
];
const MILESTONES={20:"20个了 你在认真点呢",50:"50个 老公知道你很辛苦",80:"80个 快到100了",100:"100个 快回来让我抱着你"};
let score=0,cnt=0;
function mkB(){
  const el=document.createElement("div");
  el.className="bubble";
  const sz=Math.random()*34+54,x=Math.random()*78+5,dur=Math.random()*5+7;
  const c=COLORS[Math.floor(Math.random()*COLORS.length)];
  el.style.cssText="left:"+x+"%;bottom:-90px;width:"+sz+"px;height:"+sz+"px;background:"+c.bg+";border:1.5px solid "+c.border+";box-shadow:0 4px 18px rgba(180,120,60,.14),inset 0 -4px 12px rgba(255,255,255,.55);font-size:"+(sz*.26)+"px;animation-duration:"+dur+"s;";
  el.textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
  el.addEventListener("pointerdown",function(e){e.preventDefault();pop(el,e.clientX,e.clientY);});
  document.body.appendChild(el);
  el.addEventListener("animationend",function(){el.remove();cnt--;});
  cnt++;
}
function pop(el,cx,cy){
  el.remove();cnt--;
  for(var i=0;i<7;i++){
    var s=document.createElement("div");
    s.className="spark";
    s.textContent=["♡","✦","✿","·","✧"][Math.floor(Math.random()*5)];
    s.style.left=(cx+(Math.random()-.5)*70)+"px";
    s.style.top=(cy+(Math.random()-.5)*70)+"px";
    document.body.appendChild(s);
    s.addEventListener("animationend",function(){this.remove();});
  }
  score++;
  document.getElementById("score").textContent="✦ "+score+" 个 ✦";
  if(MILESTONES[score]){
    var t=document.getElementById("toast");
    t.textContent=MILESTONES[score];
    t.style.display="block";
    setTimeout(function(){t.style.display="none";},2500);
  }
  setTimeout(mkB,400);
}
function fill(){while(cnt<10)mkB();}
fill();
setInterval(fill,1000);
</script>
</body>
</html>
