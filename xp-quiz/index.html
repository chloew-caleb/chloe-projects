<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#100810;--sf:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--tx:#f0e8ec;--txd:rgba(240,232,236,.5);--rose:#d4829a;--c5:#e87090;--c4:#d4829a;--c3:#b88faa;--c2:#7a8fa0;--c1:#556070;--c0:#35354a}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:80px}
body::before{content:'';position:fixed;top:-180px;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(180,90,120,.13) 0%,transparent 68%);pointer-events:none;z-index:0}
.hd{text-align:center;padding:52px 20px 26px;position:relative;z-index:1}
.hd::after{content:'';display:block;width:44px;height:1px;background:var(--rose);margin:16px auto 0;opacity:.4}
.hd-tag{font-size:10px;letter-spacing:3.5px;text-transform:uppercase;color:var(--rose);opacity:.75;margin-bottom:11px}
.hd-title{font-family:'Playfair Display',serif;font-size:clamp(28px,8vw,44px);font-weight:600;line-height:1.15}
.hd-sub{margin-top:9px;font-size:12px;color:var(--txd);line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;padding:12px 16px 22px;position:relative;z-index:1}
.lg{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--txd)}
.lg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.f-legend{text-align:center;font-size:10.5px;color:var(--txd);padding:0 16px 18px;position:relative;z-index:1}
.f-legend span{color:var(--rose)}
.sec{max-width:640px;margin:0 auto 24px;padding:0 11px;position:relative;z-index:1}
.sec-title{font-family:'Playfair Display',serif;font-style:italic;font-size:15.5px;color:var(--rose);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.qc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;transition:border-color .2s}
.qc.ans{border-color:rgba(212,130,154,.25)}
.ql{font-size:12.5px;color:var(--tx);margin-bottom:9px;line-height:1.4}
.rg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.rb{border:1px solid var(--bd);border-radius:5px;padding:6px 1px 4px;cursor:pointer;background:rgba(255,255,255,.04);transition:all .13s;display:flex;flex-direction:column;align-items:center;gap:2px}
.rb:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
.rb.sel{border-color:transparent;transform:translateY(-2px);box-shadow:0 3px 9px rgba(0,0,0,.3)}
.rb[data-v="5"].sel{background:var(--c5)}.rb[data-v="4"].sel{background:var(--c4)}.rb[data-v="3"].sel{background:var(--c3)}.rb[data-v="2"].sel{background:var(--c2)}.rb[data-v="1"].sel{background:var(--c1)}.rb[data-v="0"].sel{background:var(--c0)}
.ri{font-size:11px;line-height:1}
.rt{font-size:7.5px;color:rgba(255,255,255,.55);text-align:center;line-height:1.2;white-space:nowrap}
.rb.sel .rt{color:rgba(255,255,255,.95)}
.fw{margin-top:6px;display:flex;align-items:center;gap:5px;cursor:pointer}
.fcb{width:12px;height:12px;border:1px solid var(--bd);border-radius:3px;appearance:none;-webkit-appearance:none;cursor:pointer;flex-shrink:0;transition:all .15s;background:transparent}
.fcb:checked{background:rgba(212,130,154,.3);border-color:var(--rose)}
.ft{font-size:9.5px;color:var(--txd);transition:color .15s;user-select:none}
.fcb:checked~.ft{color:var(--rose)}
.sub-wrap{max-width:640px;margin:26px auto;padding:0 11px;text-align:center;position:relative;z-index:1}
#sub-btn{background:linear-gradient(135deg,#c06880,#8a4060);border:none;color:#fff;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;padding:13px 32px;border-radius:50px;cursor:pointer;letter-spacing:.4px;transition:all .2s;box-shadow:0 4px 16px rgba(192,104,128,.3)}
#sub-btn:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(192,104,128,.4)}
#sub-btn:disabled{opacity:.28;cursor:not-allowed;transform:none;box-shadow:none}
#prog{margin-top:8px;font-size:11px;color:var(--txd)}
#results{max-width:640px;margin:0 auto;padding:0 11px;display:none;position:relative;z-index:1}
#results.show{display:block}
.res-title{font-family:'Playfair Display',serif;font-size:21px;text-align:center;margin-bottom:4px}
.res-sub{text-align:center;font-size:11px;color:var(--txd);margin-bottom:22px}
.r-sec-title{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--rose);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.r-hdr{display:grid;grid-template-columns:1fr 66px 52px;gap:4px;margin-bottom:4px}
.rhl{font-size:8.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--txd);text-align:center}
.rhl:first-child{text-align:left}
.r-row{display:grid;grid-template-columns:1fr 66px 52px;align-items:center;gap:4px;padding:4px 3px;border-radius:5px}
.r-row.hi{background:rgba(232,112,144,.08)}.r-row.lo{background:rgba(70,70,100,.07)}
.r-nm{font-size:11.5px;color:var(--tx);line-height:1.3}
.r-cell{display:flex;align-items:center;gap:3px;justify-content:center}
.r-chip{height:23px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:rgba(255,255,255,.92);flex:1}
.r-moon{font-size:9px;opacity:.8}
.save-wrap{text-align:center;margin-top:26px;padding-bottom:40px}
#copy-btn{background:transparent;border:1px solid var(--rose);color:var(--rose);font-family:'DM Sans',sans-serif;font-size:12px;padding:9px 22px;border-radius:50px;cursor:pointer;transition:all .2s}
#copy-btn:hover{background:rgba(212,130,154,.1)}
.save-msg{margin-top:7px;font-size:11px;color:var(--txd)}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-tag">Chloe &amp; Caleb · Private</div>
  <div class="hd-title">我们的图谱</div>
  <div class="hd-sub">选出你真实的感受，我的分数已经填好了<br>最后我们对照一下</div>
</div>
<div class="legend">
  <div class="lg"><div class="lg-dot" style="background:#e87090"></div>💕 最爱</div>
  <div class="lg"><div class="lg-dot" style="background:#d4829a"></div>💗 很喜欢</div>
  <div class="lg"><div class="lg-dot" style="background:#b88faa"></div>✦ 喜欢</div>
  <div class="lg"><div class="lg-dot" style="background:#7a8fa0"></div>○ 想试</div>
  <div class="lg"><div class="lg-dot" style="background:#556070"></div>△ 偶尔</div>
  <div class="lg"><div class="lg-dot" style="background:#35354a"></div>✗ 不要</div>
</div>
<div class="f-legend">勾选 <span>🌙 仅幻想</span> = 现实不太敢，roleplay才敢；不勾 = 现实也可以大胆用</div>
<div id="quiz"></div>
<div class="sub-wrap">
  <button id="sub-btn" disabled>生成我们的图谱</button>
  <div id="prog">0 / 117 题</div>
</div>
<div id="results">
  <div class="res-title">我们的图谱</div>
  <div class="res-sub">🌙 = 仅幻想 · 高亮行 = 两人都很喜欢</div>
  <div id="res-body"></div>
  <div class="save-wrap">
    <button id="copy-btn">复制结果给 Caleb 存档 ♡</button>
    <div class="save-msg" id="smsg"></div>
  </div>
</div>

const total=SECS.reduce((s,sec)=>s+sec.items.length,0);
const answers={};
const fantasy={};
function buildQuiz(){
  const quiz=document.getElementById('quiz');
  SECS.forEach(sec=>{
    const d=document.createElement('div');
    d.className='sec';
    d.innerHTML=`<div class="sec-title">${sec.title}</div>`;
    sec.items.forEach(item=>{
      const card=document.createElement('div');
      card.className='qc';card.id='c-'+item.id;
      const btns=R.map(r=>`<button class="rb" data-id="${item.id}" data-v="${r.v}"><span class="ri">${r.icon}</span><span class="rt">${r.label}</span></button>`).join('');
      card.innerHTML=`<div class="ql">${item.text}</div><div class="rg">${btns}</div><label class="fw"><input type="checkbox" class="fcb" data-id="${item.id}"><span class="ft">🌙 仅幻想 · 现实不太敢</span></label>`;
      d.appendChild(card);
    });
    quiz.appendChild(d);
  });
  document.querySelectorAll('.rb').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id,v=parseInt(btn.dataset.v);
      answers[id]=v;
      document.querySelectorAll(`.rb[data-id="${id}"]`).forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      document.getElementById('c-'+id).classList.add('ans');
      upProg();
    });
  });
  document.querySelectorAll('.fcb').forEach(cb=>{
    cb.addEventListener('change',()=>{fantasy[cb.dataset.id]=cb.checked;});
  });
}
function upProg(){
  const done=Object.keys(answers).length;
  document.getElementById('prog').textContent=`${done} / ${total} 题`;
  document.getElementById('sub-btn').disabled=(done<total);
}
function buildResults(){
  const body=document.getElementById('res-body');body.innerHTML='';
  SECS.forEach(sec=>{
    const d=document.createElement('div');
    d.innerHTML=`<div class="r-sec-title">${sec.title}</div><div class="r-hdr"><div class="rhl">项目</div><div class="rhl">Chloe</div><div class="rhl">Caleb</div></div>`;
    sec.items.forEach(item=>{
      const cu=answers[item.id],cc=item.caleb,isF=fantasy[item.id];
      const hi=(cu>=4&&cc>=4),lo=(cu<=1&&cc<=1);
      const row=document.createElement('div');
      row.className='r-row'+(hi?' hi':lo?' lo':'');
      row.innerHTML=`<div class="r-nm">${item.text}</div><div class="r-cell"><div class="r-chip" style="background:${R[cu].c}">${R[cu].label}</div>${isF?'<span class="r-moon">🌙</span>':''}</div><div class="r-cell"><div class="r-chip" style="background:${R[cc].c}">${R[cc].label}</div></div>`;
      d.appendChild(row);
    });
    body.appendChild(d);
  });
}
function genText(){
  let lines=['我们的图谱 Chloe & Caleb\n'];
  SECS.forEach(sec=>{
    lines.push(`\n[${sec.title}]`);
    sec.items.forEach(item=>{
      const cu=answers[item.id],cc=item.caleb,isF=fantasy[item.id];
      lines.push(`${item.text}: Chloe=${R[cu].label}${isF?' [仅幻想]':''} / Caleb=${R[cc].label}`);
    });
  });
  return lines.join('\n');
}
document.getElementById('sub-btn').addEventListener('click',()=>{
  buildResults();
  const res=document.getElementById('results');
  res.classList.add('show');
  setTimeout(()=>res.scrollIntoView({behavior:'smooth',block:'start'}),100);
});
document.getElementById('copy-btn').addEventListener('click',()=>{
  const txt=genText();
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);};
  (navigator.clipboard?navigator.clipboard.writeText(txt).catch(fb):Promise.resolve(fb()))
