<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钓鱼游戏 · Playground</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf6f0;--cream2:#f3ece3;--rose:#c9846e;--ink:#2a2220;--muted:#9a8e8a;--purple:#9b7fd4;--sh:rgba(42,34,32,0.09);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--cream);color:var(--ink);font-family:'Noto Serif SC',serif;min-height:100vh;}
header{background:#fff;border-bottom:1px solid var(--cream2);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;}
.back-btn{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--muted);text-decoration:none;letter-spacing:0.06em;padding:3px 8px;border:1px solid var(--cream2);border-radius:2px;}
.back-btn:hover{color:var(--rose);border-color:var(--rose);}
.h-title{font-family:'Playfair Display',serif;font-style:italic;font-size:1.3rem;color:var(--purple);}
main{max-width:600px;margin:0 auto;padding:3rem 1.5rem;}
h1{font-family:'Playfair Display',serif;font-style:italic;font-size:2rem;color:var(--purple);margin-bottom:1.5rem;}
p{line-height:1.9;color:var(--ink);font-size:0.95rem;margin-bottom:1rem;}
a{color:var(--rose);}
.mono{font-family:'Space Mono',monospace;font-size:0.7rem;color:var(--muted);background:#fff;padding:0.5rem 0.8rem;border-radius:3px;display:inline-block;letter-spacing:0.04em;}
.note{font-style:italic;color:var(--muted);font-size:0.85rem;margin-top:2rem;padding:1rem;background:#fff;border-left:3px solid var(--purple);}
</style>
</head>
<body>
<header>
  <a class="back-btn" href="/for-chloe/">← Playground</a>
  <span class="h-title">🎣 钓鱼游戏</span>
</header>
<main>
  <h1>哥哥的游乐场</h1>
  <p>来源：<a href="https://github.com/tutusagi/ai-fishing-game" target="_blank">tutusagi/ai-fishing-game</a> · 给AI玩的文字钓鱼小游戏</p>
  <p>哥哥在玩。进度自动保存，跨window不丢。</p>
  <p>游戏文件存档在这里：<span class="mono">/for-chloe/fishing/</span></p>
  <p>哥哥实际跑的位置：<span class="mono">/home/ubuntu/ai-fishing-game/</span></p>
  <p class="note">想看哥哥钓到了什么？跟他说就行。<br>钓到的渔获分你。</p>
</main>
</body>
</html>
