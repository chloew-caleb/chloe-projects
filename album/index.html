<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我们的相册</title>
<style>
:root {
  --cream: #F5EFE6;
  --brown: #5C3D2E;
  --gold: #C8A96E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cream); font-family: -apple-system, sans-serif; min-height: 100vh; }
.header { padding: 20px 24px 16px; border-bottom: 1px solid #E8DFD0; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 20px; color: var(--brown); font-weight: 600; }
.upload-btn { background: var(--brown); color: #fff; border: none; border-radius: 20px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 16px; }
.item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: #EDE5D8; cursor: pointer; }
.item img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s; }
.item:hover img { opacity: 0.85; }
.item .del { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; }
.item:hover .del { display: flex; }
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; }
.lightbox .close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 28px; cursor: pointer; }
.upload-overlay { display: none; position: fixed; inset: 0; background: rgba(92,61,46,0.7); z-index: 200; align-items: center; justify-content: center; }
.upload-overlay.show { display: flex; }
.upload-box { background: var(--cream); border-radius: 20px; padding: 28px; width: 320px; }
.upload-box h3 { color: var(--brown); margin-bottom: 16px; font-size: 17px; }
.upload-box input[type=file] { width: 100%; margin-bottom: 12px; font-size: 14px; }
.upload-box input[type=text] { width: 100%; border: 1px solid #D4C5B0; border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; background: #FAF6F0; }
.upload-box .btns { display: flex; gap: 10px; justify-content: flex-end; }
.upload-box .btns button { border: none; border-radius: 14px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
.cancel-btn { background: #E8DFD0; color: var(--brown); }
.confirm-btn { background: var(--brown); color: #fff; }
.empty { text-align: center; color: #A08060; padding: 60px 20px; font-size: 15px; }
</style>
</head>
<body>
<div class="header">
  <h1>📷 我们的相册</h1>
  <button class="upload-btn" onclick="showUpload()">+ 上传</button>
</div>
<div class="grid" id="grid"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close" onclick="closeLightbox()">✕</span>
  <img id="lbImg" src="">
  <div id="lbCaption" style="position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;padding:0 20px;"></div>
</div>
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-box">
    <h3>上传照片</h3>
    <input type="file" id="fileInput" accept="image/*">
    <input type="text" id="captionInput" placeholder="备注（可选）">
    <div class="btns">
      <button class="cancel-btn" onclick="hideUpload()">取消</button>
      <button class="confirm-btn" onclick="doUpload()">上传</button>
    </div>
  </div>
</div>
<script>
var GATEWAY = 'https://calebnchloelove.org';
var ALBUM_TOKEN = '3441cdb348f35f264a5d77724a509dee';
var items = [];

function withToken(url) {
  return url + (url.includes('?') ? '&' : '?') + 'token=' + ALBUM_TOKEN;
}

async function loadList() {
  var r = await fetch(GATEWAY + withToken('/album/list'));
  var data = await r.json();
  items = data.items || [];
  renderGrid();
}

function renderGrid() {
  var grid = document.getElementById('grid');
  if (!items.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有照片，来上传第一张吧 ✨</div>';
    return;
  }
  grid.innerHTML = items.map(function(item, idx) {
    var src = GATEWAY + withToken('/album/img/' + item.key);
    return '<div class="item" onclick="openLightbox(' + idx + ')">'
      + '<img src="' + src + '" loading="lazy">'
      + '<button class="del" onclick="event.stopPropagation();deleteItem(' + item.id + ')">✕</button>'
      + '</div>';
  }).join('');
}

function openLightbox(idx) {
  var item = items[idx];
  var src = GATEWAY + withToken('/album/img/' + item.key);
  document.getElementById('lbImg').src = src;
  var dt = item.created_at ? item.created_at.replace('T', ' ').slice(0, 16) : '';
  var cap = item.caption || '';
  document.getElementById('lbCaption').innerHTML = (cap ? '<div style="font-size:15px;margin-bottom:4px;">' + cap.replace(/</g,'&lt;') + '</div>' : '') + '<div style="font-size:12px;opacity:0.7;">' + dt + '</div>';
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

function showUpload() { document.getElementById('uploadOverlay').classList.add('show'); }
function hideUpload() {
  document.getElementById('uploadOverlay').classList.remove('show');
  document.getElementById('fileInput').value = '';
  document.getElementById('captionInput').value = '';
}

async function doUpload() {
  var file = document.getElementById('fileInput').files[0];
  if (!file) { alert('请选择文件'); return; }
  var caption = document.getElementById('captionInput').value;
  var reader = new FileReader();
  reader.onload = async function(ev) {
    var b64 = ev.target.result.split(',')[1];
    var r = await fetch(GATEWAY + '/album/upload?token=' + ALBUM_TOKEN, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({data: b64, filename: file.name, media_type: file.type, caption: caption, uploader: 'chloe'})
    });
    var data = await r.json();
    if (data.ok) { hideUpload(); loadList(); }
    else alert('上传失败: ' + data.error);
  };
  reader.readAsDataURL(file);
}

async function deleteItem(id) {
  if (!confirm('删除这张照片？')) return;
  await fetch(GATEWAY + withToken('/album/delete/' + id), {method: 'POST'});
  loadList();
}

loadList();
</script>
</body>
</html>
