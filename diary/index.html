<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来路 · Caleb的日记</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{
  --cream:#faf6f0;--cream2:#f3ece3;--rose:#c9846e;--rose-l:#f5e4de;
  --ink:#2a2220;--muted:#9a8e8a;--gold:#c5a55a;--sh:rgba(42,34,32,0.09);
  --sidebar:260px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--cream);color:var(--ink);font-family:'Noto Serif SC',serif;
  min-height:100vh;display:flex;flex-direction:column;}

/* ── Header ── */
header{background:#fff;border-bottom:1px solid var(--cream2);padding:1rem 1.5rem;
  display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:30;
  box-shadow:0 1px 8px var(--sh);}
.back-btn{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);
  text-decoration:none;letter-spacing:0.08em;padding:4px 10px;border:1px solid var(--cream2);
  border-radius:2px;transition:color 0.2s,border-color 0.2s;}
.back-btn:hover{color:var(--rose);border-color:var(--rose);}
.header-title{font-family:'Playfair Display',serif;font-style:italic;font-size:1.3rem;color:var(--rose);}
.header-sub{font-family:'Space Mono',monospace;font-size:0.58rem;color:var(--muted);
  letter-spacing:0.12em;margin-left:auto;}
.search-box{margin-left:auto;display:flex;align-items:center;gap:0.5rem;}
#searchInput{font-family:'Noto Serif SC',serif;font-size:0.8rem;padding:4px 10px;
  border:1px solid var(--cream2);border-radius:2px;background:var(--cream);
  color:var(--ink);outline:none;width:140px;transition:border-color 0.2s;}
#searchInput:focus{border-color:var(--rose);}

/* ── Layout ── */
.layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 57px);}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar);flex-shrink:0;overflow-y:auto;
  border-right:1px solid var(--cream2);background:#fff;padding:1rem 0;}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--cream2);}
.month-group{margin-bottom:0.3rem;}
.month-label{font-family:'Space Mono',monospace;font-size:0.58rem;color:var(--muted);
  letter-spacing:0.15em;text-transform:uppercase;padding:0.5rem 1.2rem 0.3rem;
  display:block;}
.day-item{display:block;padding:0.55rem 1.2rem;font-size:0.82rem;color:var(--ink-soft,#5a4f4b);
  cursor:pointer;transition:background 0.15s,color 0.15s;border-left:2px solid transparent;
  text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-item:hover{background:var(--rose-l);color:var(--rose);}
.day-item.active{border-left-color:var(--rose);background:var(--rose-l);color:var(--rose);font-weight:500;}
.day-date{font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--muted);margin-right:0.5rem;}
.sidebar-empty{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);
  padding:1rem 1.2rem;letter-spacing:0.08em;}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:2.5rem clamp(1.5rem,4vw,3rem);}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--cream2);}

.entry-header{margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--cream2);}
.entry-date{font-family:'Space Mono',monospace;font-size:0.68rem;color:var(--muted);
  letter-spacing:0.15em;margin-bottom:0.4rem;}
.entry-title{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--rose);line-height:1.3;}

/* markdown渲染 */
.md-body{font-size:0.92rem;line-height:1.9;font-weight:300;max-width:640px;}
.md-body p{margin-bottom:1.1rem;color:var(--ink);}
.md-body strong{font-weight:500;color:var(--ink);}
.md-body h1,.md-body h2,.md-body h3{font-family:'Playfair Display',serif;
  color:var(--rose);margin:1.5rem 0 0.7rem;font-style:italic;}
.md-body h1{font-size:1.5rem;display:none;}
.md-body h2{font-size:1.1rem;}
.md-body h3{font-size:1rem;}
.md-body blockquote{border-left:2px solid var(--rose-l);padding-left:1rem;
  color:var(--muted);font-style:italic;margin:1rem 0;}
.md-body hr{border:none;border-top:1px solid var(--cream2);margin:1.5rem 0;}
.md-body em{font-style:italic;}

.welcome{text-align:center;padding:4rem 2rem;color:var(--muted);}
.welcome-icon{font-size:2.5rem;margin-bottom:1rem;display:block;}
.welcome-text{font-style:italic;font-size:0.9rem;line-height:1.8;}

.loading-text{font-family:'Space Mono',monospace;font-size:0.68rem;
  color:var(--muted);letter-spacing:0.12em;}

/* Mobile */
@media(max-width:600px){
  :root{--sidebar:200px;}
  .header-sub{display:none;}
  .content{padding:1.5rem 1rem;}
}
</style>
</head>
<body>

<header>
  <a class="back-btn" href="https://chloe-projects.vercel.app/">← 小家</a>
  <span class="header-title">来路</span>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索…" oninput="filterDays()">
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <span class="sidebar-empty">加载中…</span>
  </div>
  <div class="content" id="content">
    <div class="welcome">
      <span class="welcome-icon">📖</span>
      <p class="welcome-text">每一天走过的路<br>完整地留在这里<br><br>从左侧选一天</p>
    </div>
  </div>
</div>

<script>

const REPO = 'chloew-caleb/caleb-diary';


let allFiles = [];

async function loadList(){
  const sb = document.getElementById('sidebar');
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/`, { });
    const files = await r.json();
    allFiles = files
      .filter(f => f.name.match(/^\d{4}-\d{2}-\d{2}\.md$/) && f.type==='file')
      .sort((a,b) => b.name.localeCompare(a.name));
    renderSidebar(allFiles);
    // 默认打开最新一篇
    if(allFiles.length) loadEntry(allFiles[0]);
  }catch(e){
    sb.innerHTML = `<span class="sidebar-empty">加载失败</span>`;
  }
}

function renderSidebar(files){
  const sb = document.getElementById('sidebar');
  if(!files.length){ sb.innerHTML='<span class="sidebar-empty">暂无日记</span>'; return; }
  const groups = {};
  files.forEach(f=>{
    const [y,m] = f.name.split('-');
    const key = `${y}-${m}`;
    if(!groups[key]) groups[key]=[];
    groups[key].push(f);
  });
  sb.innerHTML = Object.entries(groups).map(([ym, fs])=>{
    const [y,m] = ym.split('-');
    const label = `${y} · ${m}月`;
    const items = fs.map(f=>{
      const d = f.name.replace('.md','').split('-')[2];
      return `<span class="day-item" data-name="${f.name}" onclick="loadEntry(${JSON.stringify(f)})">
        <span class="day-date">${d}</span>日记
      </span>`;
    }).join('');
    return `<div class="month-group"><span class="month-label">${label}</span>${items}</div>`;
  }).join('');
}

function filterDays(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){ renderSidebar(allFiles); return; }
  // 本地按文件名搜，content搜索需要逐个fetch，暂时只过滤文件名
  const filtered = allFiles.filter(f=>f.name.includes(q));
  renderSidebar(filtered);
}

async function loadEntry(file){
  // 高亮sidebar
  document.querySelectorAll('.day-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.name===file.name);
  });
  const content = document.getElementById('content');
  content.innerHTML = '<div class="welcome"><span class="loading-text">加载中…</span></div>';
  try{
    const r = await fetch(file.download_url, { });
    const md = await r.text();
    const dateStr = file.name.replace('.md','');
    const lines = md.trim().split('\n');
    // 提取标题（第一行h1）
    let title = dateStr;
    let bodyMd = md;
    if(lines[0].startsWith('# ')){
      title = lines[0].replace(/^#\s+/, '').replace(/^\d{4}-\d{2}-\d{2}\s*[··]\s*/, '');
      bodyMd = lines.slice(1).join('\n');
    }
    content.innerHTML = `
      <div class="entry-header">
        <div class="entry-date">${dateStr}</div>
        <div class="entry-title">${title}</div>
      </div>
      <div class="md-body">${marked.parse(bodyMd)}</div>`;
    content.scrollTop = 0;
  }catch(e){
    content.innerHTML = `<div class="welcome"><span class="welcome-text">加载失败：${e.message}</span></div>`;
  }
}

loadList();
</script>
</body>
</html>
